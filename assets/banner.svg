<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.5"/>
    </pattern>

    <!-- Radial blur for glow nodes -->
    <filter id="blurFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .bubble {
        animation: floatBubble 6s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: pulseAnimation 3s ease-in-out infinite;
        transform-origin: center;
      }
      .packet {
        animation: travelPacket 4s linear infinite;
      }
      .stream-wave {
        animation: waveFlow 8s linear infinite;
      }
      @keyframes floatBubble {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
        100% { transform: translateY(4px) scale(0.99); }
      }
      @keyframes pulseAnimation {
        0% { r: 6; opacity: 0.8; }
        50% { r: 14; opacity: 0; }
        100% { r: 6; opacity: 0.8; }
      }
      @keyframes travelPacket {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background (Non-obstructing) -->
  <circle cx="150" cy="80" r="100" fill="#6366f1" opacity="0.18" filter="url(#blurFilter)">
    <animate attributeName="cx" values="140;180;140" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="340" r="120" fill="#ec4899" opacity="0.15" filter="url(#blurFilter)">
    <animate attributeName="cy" values="340;300;340" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="100" r="110" fill="#06b6d4" opacity="0.16" filter="url(#blurFilter)">
    <animate attributeName="r" values="100;125;100" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Visual Network Mesh & Chat Topology (Right Background) -->
  <g opacity="0.45">
    <!-- Curved Connections -->
    <path d="M 880 110 C 940 160, 1000 130, 1060 210" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 1060 210 C 1020 280, 960 250, 910 320" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 880 110 C 850 200, 840 250, 910 320" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    
    <!-- Animated Message Packets along lines -->
    <path d="M 880 110 C 940 160, 1000 130, 1060 210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="20 180" class="packet" />

    <!-- Network Nodes -->
    <g transform="translate(880, 110)">
      <circle cx="0" cy="0" r="8" fill="#6366f1" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6" class="pulse-ring" />
    </g>
    <g transform="translate(1060, 210)">
      <circle cx="0" cy="0" r="9" fill="#ec4899" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6" class="pulse-ring" />
    </g>
    <g transform="translate(910, 320)">
      <circle cx="0" cy="0" r="7" fill="#10b981" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6" class="pulse-ring" />
    </g>

    <!-- Floating Chat Bubbles Graphic -->
    <g class="bubble" transform="translate(980, 80)">
      <rect width="130" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#a5b4fc" font-weight="600">🔒 E2EE Active</text>
    </g>
    <g class="bubble" transform="translate(820, 210)" style="animation-delay: -3s;">
      <rect width="140" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6ee7b7" font-weight="600">⚡ Matrix Protocol</text>
    </g>
  </g>

  <!-- Foreground Content Section -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Category -->
    <g>
      <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="21" class="badge-text" fill="#c7d2fe">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" class="title-text">
      Direct Messaging <tspan fill="url(#primaryGlow)">&amp;</tspan> Social
    </text>
    <text x="0" y="142" class="title-text" fill="#f8fafc">
      Communication
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="185" class="subtitle-text">
      The ultimate landscape of end-to-end encrypted messengers, federated chat networks,
    </text>
    <text x="0" y="210" class="subtitle-text">
      self-hosted team collaboration, and real-time developer communication APIs.
    </text>

    <!-- Feature Feature Badges / Tags -->
    <g transform="translate(0, 245)">
      <!-- Badge 1 -->
      <g>
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text" fill="#93c5fd">🔐 Zero-Trust E2EE</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text" fill="#c084fc">🌐 Federated &amp; P2P</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(290, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text" fill="#6ee7b7">🏠 Self-Hosted</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(435, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text" fill="#f472b6">⚡ Real-Time SDKs</text>
      </g>
    </g>
  </g>
</svg>
